name: Supabase Keepalive

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keepalive endpoint
        env:
          KEEPALIVE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
          KEEPALIVE_TOKEN: ${{ secrets.SUPABASE_KEEPALIVE_TOKEN }}
        run: |
          if [ -z "$KEEPALIVE_URL" ]; then
            echo "SUPABASE_KEEPALIVE_URL is not configured"
            exit 1
          fi

          if [ -n "$KEEPALIVE_TOKEN" ]; then
            curl --fail --silent --show-error \
              -H "x-keepalive-token: $KEEPALIVE_TOKEN" \
              "$KEEPALIVE_URL"
          else
            curl --fail --silent --show-error "$KEEPALIVE_URL"
          fi
